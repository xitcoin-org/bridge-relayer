name: Relayer

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: relayer-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  protocol:
    name: Protocol and state tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run vectors
      - name: Audit production dependencies
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          audit_output=""
          for attempt in 1 2 3; do
            set +e
            audit_output="$(npm audit --omit=dev --audit-level=high \
              --fetch-timeout=60000 \
              --fetch-retries=2 \
              --fetch-retry-mintimeout=1000 \
              --fetch-retry-maxtimeout=10000 2>&1)"
            audit_status=$?
            set -e
            printf '%s\n' "$audit_output"
            if [ "$audit_status" -eq 0 ]; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 10))
            fi
          done
          if printf '%s\n' "$audit_output" | grep -Eq 'audit network timeout|audit endpoint returned an error' &&
            git diff --quiet "$BASE_SHA" HEAD -- package.json package-lock.json; then
            echo "::warning::npm audit registry unavailable; dependency manifests are unchanged from the reviewed base"
            exit 0
          fi
          exit "$audit_status"
